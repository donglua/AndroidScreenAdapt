name: Publish Maven

on:
  push:
    tags:
      - "v*"
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to use Gradle default)"
        required: false
        type: string
      target:
        description: "Publish target"
        required: true
        default: "github_packages"
        type: choice
        options:
          - github_packages
          - custom_maven
          - both

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify before publish
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./gradlew check --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'github_packages' || inputs.target == 'both' }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./gradlew :autosize:publishReleasePublicationToGitHubPackagesRepository --no-daemon --stacktrace

      - name: Publish to Custom Maven Repository
        if: ${{ secrets.MAVEN_REPO_URL != '' && (github.event_name != 'workflow_dispatch' || inputs.target == 'custom_maven' || inputs.target == 'both') }}
        env:
          MAVEN_REPO_URL: ${{ secrets.MAVEN_REPO_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./gradlew :autosize:publishReleasePublicationToCustomMavenRepository --no-daemon --stacktrace

      - name: Upload AAR and POM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autosize-maven-artifacts
          path: |
            autosize/build/outputs/aar/autosize-release.aar
            autosize/build/publications/release/pom-default.xml
