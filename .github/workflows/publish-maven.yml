name: Publish to Sonatype Central

on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or 0.1.0-alpha01)"
        required: true
        default: "0.1.0-alpha01"
        type: string

permissions:
  contents: read

concurrency:
  group: sonatype-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release AAR to central.sonatype.org
    permissions:
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Resolve release version
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="${MANUAL_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a valid semantic version such as 0.1.0 or v0.1.0-alpha01, got: $version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project checks and release artifacts
        env:
          PUBLISHED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./gradlew --no-daemon --stacktrace check
          ./gradlew --no-daemon --stacktrace :autosize:prepareRelease

      - name: Publish signed library to central.sonatype.org
        env:
          PUBLISHED_VERSION: ${{ steps.meta.outputs.version }}
          PUBLISHED_GROUP_ID: ${{ vars.PUBLISHED_GROUP_ID }}
          PUBLISHED_ARTIFACT_ID: ${{ vars.PUBLISHED_ARTIFACT_ID }}
          PUBLISHED_NAME: ${{ vars.PUBLISHED_NAME }}
          PUBLISHED_DESCRIPTION: ${{ vars.PUBLISHED_DESCRIPTION }}
          PUBLISHED_URL: ${{ vars.PUBLISHED_URL }}
          PUBLISHED_LICENSE_NAME: ${{ vars.PUBLISHED_LICENSE_NAME }}
          PUBLISHED_LICENSE_URL: ${{ vars.PUBLISHED_LICENSE_URL }}
          PUBLISHED_DEVELOPER_ID: ${{ vars.PUBLISHED_DEVELOPER_ID }}
          PUBLISHED_DEVELOPER_NAME: ${{ vars.PUBLISHED_DEVELOPER_NAME }}
          PUBLISHED_DEVELOPER_EMAIL: ${{ vars.PUBLISHED_DEVELOPER_EMAIL }}
          SONATYPE_NAMESPACE: ${{ vars.SONATYPE_NAMESPACE || 'io.github.donglua' }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :autosize:publishToSonatype -PsonatypePublishingType=automatic

      - name: Attach release AAR to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cp "autosize/build/outputs/aar/autosize-release.aar" "$RUNNER_TEMP/autosize-$RELEASE_VERSION.aar"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/autosize-$RELEASE_VERSION.aar" --clobber
